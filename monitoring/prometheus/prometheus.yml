global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    environment: local
    service: example-app

rule_files: []

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
        labels:
          service: prometheus

  - job_name: example-app
    metrics_path: /metrics
    scrape_timeout: 5s
    honor_timestamps: false
    scheme: http
    static_configs:
      - targets:
          - app:8080
        labels:
          service: example-app
