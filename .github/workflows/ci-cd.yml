name: Test, Build, and Publish

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run unit tests
        run: make test

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build image locally for smoke test
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          push: false
          tags: example-app:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Run container smoke test
        run: make docker-test IMAGE_NAME=example-app VERSION_TAG=test

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/example-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/example-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max